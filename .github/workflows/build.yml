name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest 已预装 Android SDK，不要执行 android-actions/setup-android
      # （它内部调用的 "sdkmanager tools" 包已被 Google 移除，会直接报错）。
      # API 37 起 Google 改用 minor version 命名：仓库里是 platforms;android-37.0。
      - name: Ensure Android SDK 37 + accept licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            for pkg in "platforms;android-37.0" "build-tools;37.0.0" "platforms;android-36"; do
              yes | "$SDKMGR" --sdk_root="$SDK" --install "$pkg" > /dev/null 2>&1 || true
            done
          fi
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      # AGP 9.4.1 需要 Gradle 9.x（Miuix 官方用 9.8.1）
      - name: Setup Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Show toolchain info
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "===== BUILD FAILED (exit $code) ====="

            # ① 打印 Kotlin 编译错误（e: 文件:行号:列 消息）——最关键的信息
            echo "----- Kotlin compile errors (^e:) -----"
            grep "^e: " build.log | head -60 || true

            # ② 把每条编译错误发成 ::error 注解。
            #    注解可通过公开 API 读取（check-runs/<id>/annotations），
            #    这样无需下载日志即可远程定位错误。
            grep "^e: " build.log | head -20 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
              printf '::error title=Kotlin::%s\n' "$clean"
            done

            # ③ Gradle 失败摘要
            echo "----- FAILURE block -----"
            grep -A 14 "^FAILURE:\|^\* What went wrong" build.log | head -60 || true

            # ④ 日志尾部
            echo "----- tail -----"
            tail -n 60 build.log

            # ⑤ 写入 job summary
            {
              echo "## ❌ Build failed (exit $code)"
              echo ""
              echo "### Kotlin compile errors"
              echo '```text'
              grep "^e: " build.log | head -60 || echo "(no ^e: lines)"
              echo '```'
              echo "### Failure block"
              echo '```text'
              grep -A 14 "^FAILURE:\|^\* What went wrong" build.log | head -60 || true
              echo '```'
              echo "### Tail"
              echo '```text'
              tail -n 60 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            exit $code
          fi
          echo "BUILD OK"
          ls -l app/build/outputs/apk/debug/ || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiuixLedger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
